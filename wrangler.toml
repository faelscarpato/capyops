name = "capyops-ml"
compatibility_date = "2026-02-05"

# Cloudflare Pages Functions
[vars]
# Public endpoints (no secrets). Do NOT put secrets here.

# Secrets must be set via `wrangler secret put` or Cloudflare dashboard:
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# MELI_CLIENT_ID
# MELI_CLIENT_SECRET
# MELI_REDIRECT_URI
# Optional: MELI_AUTH_URL, MELI_BASE_URL
